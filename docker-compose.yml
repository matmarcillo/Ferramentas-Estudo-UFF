services:
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal-avaliuff
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  db:
    image: postgres:17
    container_name: db-avaliuff
    labels:
      - "autoheal=true"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - avaliuff_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ./API
    container_name: api-avaliuff
    labels:
      - "autoheal=true"
    environment:
      DB_HOST: db
      DB_NAME: mydb
      DB_USER: postgres
      DB_PASSWORD: password
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: frontend-avaliuff
    labels:
      - "autoheal=true"
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  avaliuff_prod_data: